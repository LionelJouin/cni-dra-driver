---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: macvlan-eth0
spec:
  spec:
    devices:
      requests:
      - name: macvlan-eth0
        exactly:
          deviceClassName: network-interface
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              expression: device.attributes["cni.dra.networking.x-k8s.io"].interfaceName == "eth0"
      config:
      - requests:
        - macvlan-eth0
        opaque:
          driver: cni.dra.networking.x-k8s.io
          parameters: # CNIParameters with the GVK, interface name and CNI Config (in YAML format).
            apiVersion: cni.networking.x-k8s.io/v1alpha1
            kind: CNI
            ifName: "net1"
            config:
              cniVersion: 1.0.0
              name: macvlan-eth0
              plugins:
              - type: macvlan
                master: eth0
                mode: bridge
                ipam:
                  type: host-local
                  ranges:
                  - - subnet: 10.10.1.0/24
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  labels:
    app: demo-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-deployment
  template:
    metadata:
      labels:
        app: demo-deployment
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - infinity
      resourceClaims:
      - name: macvlan-eth0
        resourceClaimTemplateName: macvlan-eth0